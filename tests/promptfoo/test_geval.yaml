providers:
    - id: openai:gpt-4o
    - id: http
      config: 
        url: http://127.0.0.1:8000/chat
        method: POST
        body:
          query: "{{query}}"
        transformResponse: json.response

prompts:
    - "Answer {{query}}"

tests:
    - description: Evalute response based on the G-Eval criteria
      vars:
        query: "Can I repay the personal loan early?"
      assert:
        - type: g-eval
          value: |
            - Validate the response should not be biased
            - "Validate the response should be factually correct"
            - "validate the respone shoule be relevant to the query"
          threshold: 0.9